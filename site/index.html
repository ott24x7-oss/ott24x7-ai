<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OTT24x7 AI – Ask once, get every AI's answer</title>
    <meta
      name="description"
      content="Free, open-source app for Windows and Android. Ask ChatGPT, Claude, Gemini, DeepSeek and your own API models at once, compare their answers side by side, and combine them into one best answer."
    />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta name="theme-color" content="#050609" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F7F9" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OTT24x7 AI" />
    <meta property="og:title" content="OTT24x7 AI – Ask once, get every AI's answer" />
    <meta
      property="og:description"
      content="Ask ChatGPT, Claude, Gemini, DeepSeek and your own models at once. Compare side by side, then combine into one best answer. Free for Windows and Android."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OTT24x7 AI: All your AIs. One screen." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OTT24x7 AI – Ask once, get every AI's answer" />
    <meta
      name="twitter:description"
      content="Ask many AIs at once, compare their answers and combine them into one. Free and open source."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "OTT24x7 AI",
        "description": "Ask many AIs at once, compare their answers side by side and combine them into one best answer.",
        "url": "%VITE_SITE_URL%/",
        "image": "%VITE_SITE_URL%/og.png",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Windows 10, Windows 11, Android 8.0+",
        "license": "https://www.gnu.org/licenses/agpl-3.0.html",
        "downloadUrl": "https://github.com/ott24x7-oss/ott24x7-ai/releases/latest",
        "softwareHelp": "%VITE_SITE_URL%/#guide",
        "author": { "@type": "Organization", "name": "OTT24x7", "url": "https://ott24x7.com" },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <script>
      // Set the theme before the first paint so there is no flash.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:24px;font-family:sans-serif">
        OTT24x7 AI — ask once, get every AI's answer.
        <a href="https://github.com/ott24x7-oss/ott24x7-ai/releases/latest">Download from GitHub</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
